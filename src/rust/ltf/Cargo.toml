# 🦀 The Rust/WebAssembly port of pwa/app.js (a cdylib loaded by wasm-bindgen in index.html).
[package]
name = "ltf"
version = "12.0.0"
edition = "2021"
description = "Les Trois Forts — Service Academy (Rust/WebAssembly port of pwa/app.js)"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

# 📦 wasm-bindgen is pinned: it must match the wasm-bindgen CLI used by build.sh (0.2.129)
[dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }

# 🌐 only the Web APIs the app uses
[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "console", "Document", "Element", "HtmlElement", "Node", "NodeList", "HtmlCollection",
  "HtmlInputElement", "HtmlImageElement", "HtmlCanvasElement", "CanvasRenderingContext2d",
  "Event", "EventTarget", "MouseEvent", "PointerEvent", "WheelEvent", "AddEventListenerOptions",
  "DomRect", "CssStyleDeclaration", "DomTokenList", "History", "Location", "Storage",
  "MediaQueryList", "FileReader", "File", "FileList", "Blob",
  "IdbFactory", "IdbOpenDbRequest", "IdbRequest", "IdbDatabase", "IdbTransaction",
  "IdbObjectStore", "IdbCursor", "IdbCursorWithValue", "IdbTransactionMode",
  "SpeechSynthesis", "SpeechSynthesisUtterance", "SpeechSynthesisVoice",
  "AudioContext", "BaseAudioContext", "OscillatorNode", "GainNode", "AudioParam", "AudioNode",
  "AudioDestinationNode", "OscillatorType", "AudioScheduledSourceNode",
]

# 🗜️ smallest wasm: optimize for size, LTO, one codegen unit, abort on panic, strip symbols
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
