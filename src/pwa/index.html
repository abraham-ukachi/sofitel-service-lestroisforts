<!-- 🌗 the pre-paint theme script (before the CSS, so there is never a flash of the wrong theme) -->
<script>
// 🌗 pre-paint theme: runs before anything else, so the page never flashes the wrong theme
// (the Rust/WASM app loads later and keeps the same `data-theme`)
try {
  // the saved theme (localStorage `ltf_v1`), `auto` by default
  var preferredTheme = JSON.parse(localStorage.getItem('ltf_v1') || '{}').theme || 'auto';
  // auto = follow the system ☀️ / 🌙
  if (preferredTheme === 'auto')
    preferredTheme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  // apply it on the html element
  document.documentElement.setAttribute('data-theme', preferredTheme);
} catch (error) {}
</script><style>

/* 🃏 flashcards (3D flip) */
.flip {
  position: relative;
  height: min(62vh, 440px);
  perspective: 1200px;
  margin: 6px 0 12px;
  cursor: pointer;
}
.face {
  position: absolute;
  inset: 0;
  border-radius: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 22px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transition: transform 0.5s;
  overflow: auto;
  line-height: 1.45;
}
.front {
  background: var(--sf);
  border: 1.5px solid var(--gbtn);
}
.fq {
  font-size: 26px;
  line-height: 1.25;
}
.back {
  background: #f6efe1;
  color: #0f1d33;
  transform: rotateY(180deg);
  font-size: 15.5px;
}
.back .btxt {
  max-width: 100%;
}
.flip.on .front {
  transform: rotateY(180deg);
}
.flip.on .back {
  transform: rotateY(360deg);
}
.hint {
  position: absolute;
  bottom: 14px;
  font-size: 12px;
  color: var(--mu);
}
.bimg {
  max-height: 150px;
  max-width: 80%;
  border-radius: 14px;
  margin-bottom: 12px;
  object-fit: cover;
}
.back .chip.gold {
  background: #efe2bd;
  color: #7a5a12;
}

/* 🪟 bottom sheet + dialog (+ the ⓘ sheet sections) */
.ov.scrim {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--scrim);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fade 0.18s;
}
.ov.scrim.center {
  align-items: center;
  padding: 24px;
}
.ov.out {
  animation: fade 0.18s reverse forwards;
}
.ov.out .sheet {
  animation: up 0.18s reverse forwards;
}
@keyframes fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes up {
  from {
    transform: translateY(100%);
  }
  to {
    transform: none;
  }
}
@keyframes pop {
  from {
    opacity: 0;
    transform: scale(0.92);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.sheet {
  background: var(--bar);

  width: 100%;

}

<!-- 🗺️ briefing table plan (booking sheet + full screen) -->
<script>
// 🗺️ Briefing table plan: tap a table to see its booking sheet, or open the plan full screen.
// Shared by the JS & the Rust builds (it only listens to clicks on the generated markup) 🤝
(function () {
  // the labels [title, close, free table, no booking, reserved] by language 🏷️
  var TEXTS = {
    fr: [
      'Plan des tables',
      'Fermer',
      'Table libre ce soir',
      'Aucune réservation sur cette table.',
      'Réservée',
    ],
    en: ['Table plan', 'Close', 'Free table tonight', 'No booking on this table.', 'Reserved'],
  };

  /**
   * `lang` - Function 🌍
   *
   * @returns { string[] } - the labels in the plan's language (`#bplan[data-l]`)
   */
  function lang() {
    var plan = document.getElementById('bplan');
    return TEXTS[(plan && plan.dataset.l) || 'fr'] || TEXTS.fr;
  }

  /**
   * `sel` - Function 🎯
   *
   * @param { string | null } id - the table to highlight (null = none)
   * @returns { void }
   */
  function sel(id) {
    document.querySelectorAll('.bplan .tb, .bpfull .tb').forEach(function (tableButton) {
      tableButton.classList.toggle('sel', tableButton.dataset.id === id);
    });
  }

  /**
   * `info` - Function 📋
   *
   * Opens the booking sheet of a table (the matching `.rescard` of the briefing, or "free table").
   *
   * @param { string } id - the table id
   * @returns { void }
   */
  function info(id) {
    var labels = lang();
    sel(id);
    // the booking card of this table (if reserved) & the previous sheet
    var reservationCard = document.querySelector('.pad .rescard[data-res="' + id + '"]');
    var existingSheet = document.getElementById('bpSheet');
    if (existingSheet) existingSheet.remove();
    // the sheet (above the full screen plan)
    var sheet = document.createElement('div');
    sheet.id = 'bpSheet';
    sheet.className = 'ov scrim';
    sheet.style.zIndex = 60;
    sheet.innerHTML =
      '<div class="sheet"><div class="grab"></div><div class="sbody"><div class="row"><h2 style="margin:0">' +
      id +
      '</h2><span class="chip' +
      (reservationCard ? ' gold' : '') +
      ' rt">' +
      (reservationCard ? labels[4] : labels[2]) +
      '</span></div><div class="bpcard">' +
      (reservationCard ? reservationCard.innerHTML : '<div class="muted">' + labels[3] + '</div>') +
      '</div></div><div class="abar"><button class="btn grow" id="bpX">' +
      labels[1] +
      '</button></div></div>';
    // ✕ or a tap on the scrim closes it
    sheet.onclick = function (event) {
      if (event.target === sheet || event.target.id === 'bpX') {
        sheet.remove();
        sel(null);
      }
    };
    document.body.appendChild(sheet);
  }

  /**
   * `full` - Function 🔍
   *
   * Shows the plan full screen (a copy of the SVG), with the Fullscreen API when available.
   *
   * @returns { void }
   */
  function full() {
    var labels = lang();
    var plan = document.getElementById('bplan');
    if (!plan) return;
    var svg = plan.querySelector('svg');
    var fullScreen = document.createElement('div');
    fullScreen.className = 'ov bpfull';
    fullScreen.id = 'bpFS';
    fullScreen.innerHTML =
      '<div class="bph"><b>' +
      labels[0] +
      '</b><button class="btn txt" id="bpFX">✕ ' +
      labels[1] +
      '</button></div><div class="bpb">' +
      svg.outerHTML +
      '</div>';
    document.body.appendChild(fullScreen);
    try {
      if (fullScreen.requestFullscreen) fullScreen.requestFullscreen().catch(function () {});
    } catch (error) {}
  }

  /**
   * `closeFull` - Function 👋
   *
   * @returns { void }
   */
  function closeFull() {
    var fullScreen = document.getElementById('bpFS');
    if (fullScreen) fullScreen.remove();
    try {
      if (document.fullscreenElement) document.exitFullscreen();
    } catch (error) {}
  }
  // 👆 every click: full screen button, close button or a table
  document.addEventListener('click', function (event) {
    var target = event.target;
    if (target.closest('#bpFull')) {
      full();
      return;
    }
    if (target.closest('#bpFX')) {
      closeFull();
      return;
    }
    var tableElement = target.closest('.bplan [data-id], .bpfull [data-id]');
    if (tableElement) {
      info(tableElement.dataset.id);
    }
  });
  // 📱 leaving the browser full screen (Esc / back gesture) also closes our full screen view
  document.addEventListener('fullscreenchange', function () {
    if (!document.fullscreenElement) {
      var fullScreen = document.getElementById('bpFS');
      if (fullScreen && fullScreen.dataset.fs) fullScreen.remove();
    } else {
      var existingFullScreen = document.getElementById('bpFS');
      if (existingFullScreen) existingFullScreen.dataset.fs = 1;
    }
  });
  // 🧭 navigation: close everything
  addEventListener('hashchange', function () {
    closeFull();
    var sheet = document.getElementById('bpSheet');
    if (sheet) sheet.remove();
  });
})();
</script>

<!-- 🔐 crew code: unlocks the encrypted guest names of the briefing -->
<script>
// 🔐 Crew code: the guest names of the briefing are encrypted (names.js, AES-GCM + PBKDF2-SHA256)
// and only shown after the team code is typed. No guest name is ever in clear text in the app 🛡️.
(function () {
  // the decrypted names { table: name }, the localStorage key of the code & the labels by language
  var NAMES = null,
    CODE_KEY = 'ltf_code',
    LABELS = {
      fr: ['Code équipe', 'Afficher les noms', 'Code incorrect', 'Noms des clients affichés', 'Masquer'],
      en: ['Crew code', 'Show names', 'Wrong code', 'Guest names shown', 'Hide'],
    };

  /**
   * `b64` - Function 🔢
   *
   * @param { string } base64 - base64
   * @returns { Uint8Array } - the bytes
   */
  function b64(base64) {
    return Uint8Array.from(atob(base64), function (char) {
      return char.charCodeAt(0);
    });
  }

  /**
   * `dec` - Async Function 🔓
   *
   * Derives the AES key from the code (PBKDF2-SHA256) and decrypts `window.LTF_NAMES`.
   *
   * @param { string } code - the crew code
   * @returns { Promise<object> } - the names (throws on a wrong code)
   */
  async function dec(code) {
    var encrypted = window.LTF_NAMES;
    if (!encrypted) throw 0;
    var baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, [
      'deriveKey',
    ]);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(encrypted.s), iterations: encrypted.it, hash: 'SHA-256' },
      baseKey,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt'],
    );
    var plain = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64(encrypted.iv) },
      key,
      b64(encrypted.c),
    );
    return JSON.parse(new TextDecoder().decode(plain));
  }

  /**
   * `fill` - Function ✍️
   *
   * @returns { void } - writes " · <name>" into every `.gn[data-t]` (or clears it)
   */
  function fill() {
    document.querySelectorAll('.gn').forEach(function (nameElement) {
      var guestName = NAMES && NAMES[nameElement.dataset.t];
      nameElement.textContent = guestName ? ' · ' + guestName : '';
    });
  }

  /**
   * `box` - Function 🧩
   *
   * Renders the crew code box: "names shown + Hide" when unlocked, else the code input.
   *
   * @param { HTMLElement } plan - the `#gnBox` element
   * @returns { void }
   */
  function box(plan) {
    var labels = LABELS[plan.dataset.l] || LABELS.fr;
    plan.dataset.init = 1;
    // 🔓 unlocked: "Hide" forgets the code on this phone
    if (NAMES) {
      plan.innerHTML =
        '<div class="row"><div class="tx">🔓 ' +
        labels[3] +
        '</div><button class="btn txt rt" id="gnLock">' +
        labels[4] +
        '</button></div>';
      plan.querySelector('#gnLock').onclick = function () {
        NAMES = null;
        try {
          localStorage.removeItem(CODE_KEY);
        } catch (error) {}
        fill();
        box(plan);
      };
      // 🔐 locked: code input + "Show names"
    } else {
      plan.innerHTML =
        '<div class="row" style="gap:8px"><div class="srch" style="margin:0;flex:1"><input id="gnCode" type="password" inputmode="numeric" placeholder="🔒 ' +
        labels[0] +
        '" autocomplete="off"></div><button class="btn" id="gnGo">' +
        labels[1] +
        '</button></div><div class="muted sm" id="gnMsg"></div>';
      // try the code; remember it on this phone when it works ✅
      var go = async function () {
        var code = plan.querySelector('#gnCode').value.trim();
        plan.querySelector('#gnMsg').textContent = '…';
        try {
          NAMES = await dec(code);
          try {
            localStorage.setItem(CODE_KEY, code);
          } catch (error) {}
          fill();
          box(plan);
        } catch (error) {
          plan.querySelector('#gnMsg').textContent = labels[2];
        }
      };
      plan.querySelector('#gnGo').onclick = go;
      plan.querySelector('#gnCode').onkeydown = function (event) {
        if (event.key === 'Enter') go();
      };
    }
    fill();
  }

  /**
   * `scan` - Async Function 👂
   *
   * When the briefing shows a `#gnBox`, unlocks with the saved code (if any) and renders the box.
   *
   * @returns { Promise<void> }
   */
  async function scan() {
    var plan = document.getElementById('gnBox');
    if (!plan || plan.dataset.init) return;
    if (!NAMES) {
      var code = null;
      try {
        code = localStorage.getItem(CODE_KEY);
      } catch (error) {}
      if (code) {
        try {
          NAMES = await dec(code);
        } catch (error) {
          try {
            localStorage.removeItem(CODE_KEY);
          } catch (ignored) {}
        }
      }
    }
    if (!plan.dataset.init) box(plan);

  new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });

<script>
// 👇 Swipe down to close a bottom sheet (like a native iOS / Android sheet).
// Works on every `.ov.scrim` sheet; inner scroll boxes scroll first, the sheet follows only from their top.
(function () {
  // the current gesture (null = none)
  var gesture = null;

  /**
   * `scrollableParent` - Function 📜
   *
   * @param { Element } start - the touched element
   * @param { Element } sheet - the sheet
   * @returns { Element | null } - the closest scrollable box between them
   */
  function scrollableParent(start, sheet) {
    for (var element = start; element && element !== sheet; element = element.parentElement) {
      if (element.scrollHeight > element.clientHeight + 2) {
        var overflowY = getComputedStyle(element).overflowY;
        if (overflowY === 'auto' || overflowY === 'scroll') return element;
      }
    }
    return null;
  }
  // 👇 finger down on a sheet: remember where (and whether its scroll box is at the top)
  addEventListener(
    'touchstart',
    function (event) {
      var target = event.target,
        overlay = target.closest && target.closest('.ov.scrim');
      if (!overlay || event.touches.length > 1) {
        gesture = null;
        return;
      }
      var sheet = overlay.querySelector('.sheet');
      if (!sheet) {
        gesture = null;
        return;
      }
      var inSh = sheet.contains(target),
        box = inSh ? scrollableParent(target, sheet) : null;
      gesture = {
        ov: overlay,
        sh: sheet,
        y: event.touches[0].clientY,
        x: event.touches[0].clientX,
        t: Date.now(),
        box: box,
        top: box ? box.scrollTop <= 0 : true,
        dy: 0,
        on: false,
        dead: false,
      };
    },
    { passive: true },
  );
  // 👉 finger moves: decide (drag the sheet down or let it scroll), then follow the finger
  addEventListener(
    'touchmove',
    function (event) {
      if (!gesture) return;
      var dy = event.touches[0].clientY - gesture.y,
        dx = event.touches[0].clientX - gesture.x;
      // not decided yet: a vertical move down from the top = drag 🏁, anything else = dead
      if (!gesture.on && !gesture.dead) {
        if (Math.abs(dy) < 6 && Math.abs(dx) < 6) {
          if (event.cancelable && dy > 0 && gesture.top) event.preventDefault();
          return;
        }
        if (
          dy > 0 &&
          Math.abs(dy) > Math.abs(dx) &&
          gesture.top &&
          (!gesture.box || gesture.box.scrollTop <= 0)
        ) {
          gesture.on = true;
          gesture.y0 = event.touches[0].clientY;
          gesture.sh.classList.add('drag');
        } else {
          gesture.dead = true;
        }
      }
      // dragging: move the sheet & fade the scrim
      if (gesture.on) {
        if (event.cancelable) event.preventDefault();
        gesture.dy = Math.max(0, event.touches[0].clientY - gesture.y0);
        gesture.sh.style.transform = 'translateY(' + gesture.dy + 'px)';
        gesture.ov.style.opacity = String(Math.max(0.35, 1 - gesture.dy / (gesture.sh.offsetHeight * 1.4)));
      } else if (gesture.dead && dy > 0 && gesture.box && gesture.box.scrollTop <= 0 && event.cancelable) {
        event.preventDefault();
      }
    },
    { passive: false },
  );

  /**
   * `end` - Function 👆
   *
   * The finger lifts: close when dragged far enough (or fast enough), else snap back.
   *
   * @returns { void }
   */
  function end() {
    if (!gesture || !gesture.on) {
      gesture = null;
      return;
    }
    var finished = gesture;
    gesture = null;
    var velocity = finished.dy / Math.max(1, Date.now() - finished.t),
      sheetHeight = finished.sh.offsetHeight;
    finished.sh.style.transition = 'transform .2s ease-out';
    finished.ov.style.transition = 'opacity .2s';
    // far (> 140 px or 30%) or fast (> 0.6 px/ms): slide out & remove 👋
    if (finished.dy > Math.min(140, sheetHeight * 0.3) || velocity > 0.6) {
      finished.sh.style.transform = 'translateY(' + (sheetHeight + 40) + 'px)';
      finished.ov.style.opacity = '0';
      setTimeout(function () {
        if (finished.ov.id === 'sheet' && window.LTFcloseSheet) {
          finished.ov.classList.add('gone');
        }
        finished.ov.remove();
      }, 200);
      // else: back in place
    } else {
      finished.sh.style.transform = '';
      finished.ov.style.opacity = '';
      setTimeout(function () {
        finished.sh.classList.remove('drag');
        finished.sh.style.transition = '';
        finished.ov.style.transition = '';
      }, 220);
    }
  }
  // 👂 the end of the gesture
  addEventListener('touchend', end, { passive: true });
  addEventListener('touchcancel', end, { passive: true });
})();
</script>

<script>
// 🧀 Cheese strength scale: a card under the "Plateau de fromages" heading of La Carte,
// mildest to strongest, with the milk and a short taste note per cheese.
(function () {
  // cheese -> [strength 0..9, milk emoji, French taste, English taste] (update it when the board changes) 🏷️
  var SCALE = {
    'Comté 18 mois': [6, '🐄', 'Noisette, beurre, fruité', 'Nutty, buttery, fruity'],
    'Tomme fleurie': [2, '🐄', 'Floral, lactique, souple', 'Floral, milky, supple'],
    "Brin d'Amour": [5, '🐑', 'Herbes du maquis, crémeux', 'Maquis herbs, creamy'],
    'Tommette corse': [2.5, '🐑', 'Lactique, franc', 'Milky, clean'],
    'Casanu': [7.5, '🐐', 'Croûte lavée, puissant', 'Washed rind, punchy'],
    'Chèvre cendré': [3, '🐐', 'Acidulé, fondant', 'Tangy, melting'],
    'Montbriac': [4, '🐄', 'Bleu doux, crémeux', 'Gentle blue, creamy'],
    'Gorgonzola': [9, '🐄', 'Bleu puissant, piquant', 'Powerful, sharp blue']
  };

  /**
   * `isEnglish` - Function 🌍
   *
   * @returns { boolean } - true when the app is in English
   */
  function isEnglish() {
    try {
      return JSON.parse(localStorage.getItem('ltf_v1') || '{}').lang === 'en';
    } catch (error) {
      return false;
    }
  }

  /**
   * `card` - Function 🧩
   *
   * @returns { string } - the scale card (board order from data.js `LTF.fromages`)
   */
  function card() {
    var english = isEnglish(),
      cheeses = (window.LTF && LTF.fromages) || [];
    var rows = cheeses.map(function (cheese, index) {
      var scale = SCALE[cheese.n] || [5, '🧀', '', ''];
      var percent = Math.round((scale[0] / 9) * 100);
      return (
        '<div class="qs-r"><div class="qs-n">' +
        (cheese.side ? '＋' : index + 1) +
        '</div><div class="qs-m">' +
        scale[1] +
        '</div><div class="qs-t"><div class="qs-nm">' +
        cheese.n +
        (cheese.side ? ' <span class="muted sm">' + (english ? 'on the side' : 'à côté') + '</span>' : '') +
        '</div><div class="qs-b"><i style="width:' +
        percent +
        '%"></i></div><div class="muted sm">' +
        (english ? scale[3] : scale[2]) +
        '</div></div></div>'
      );
    }).join('');
    return (
      '<div class="card qs" id="qScale"><div class="qs-h"><span>🧀 ' +
      (english ? 'Mildest' : 'Le plus doux') +
      '</span><span>' +
      (english ? 'Strongest' : 'Le plus fort') +
      ' 🔥</span></div><div class="qs-g"></div>' +
      rows +
      '<p class="muted sm" style="margin:10px 0 0">' +
      (english
        ? 'Mildest to strongest by taste. 🐄 cow · 🐑 sheep · 🐐 goat.'
        : 'Du plus doux au plus fort, selon le goût. 🐄 vache · 🐑 brebis · 🐐 chèvre.') +
      '</p></div>'
    );
  }

  /**
   * `run` - Function 👂
   *
   * Adds the card under every cheese board heading (not while searching).
   *
   * @returns { void }
   */
  function run() {
    var headings = document.querySelectorAll('.sh');
    for (var index = 0; index < headings.length; index++) {
      var heading = headings[index],
        title = heading.textContent.trim();
      if (title !== 'Plateau de fromages' && title !== 'Cheese board') continue;
      var next = heading.nextElementSibling;
      if (next && next.id === 'qScale') continue;
      var search = document.getElementById('srch');
      if (search && search.value.trim()) continue;
      var scaleCard = document.createElement('div');
      scaleCard.innerHTML = card();
      heading.parentNode.insertBefore(scaleCard.firstChild, next);
    }
  }
  // 👂 watch every screen change
  new MutationObserver(run).observe(document.documentElement, { childList: true, subtree: true });
})();

<!-- 🍸 bar game icons -->
<script>
// 🍸 Bar icons: draws a small colored icon in each chip of the bar game (ingredients, glass, garnish)
// so the waiter recognises the bottles & glasses at a glance.
(function () {
  // the outline color of the glasses
  var OUTLINE = '#9fb8d0';

  /**
   * `svg` - Function 🎨
   *
   * @param { string } body - the SVG body
   * @returns { string } - a 22 px `<svg>`
   */
  function svg(body) {
    return (
      '<svg viewBox="0 0 24 24" width="22" height="22" stroke-linejoin="round" stroke-linecap="round">' +
      body +
      '</svg>'
    );
  }

  /**
   * `stem` - Function 🍷
   *
   * @param { number } y1 - the top of the stem
   * @param { number } y2 - the foot
   * @returns { string } - the stem & foot of a stemmed glass
   */
  function stem(y1, y2) {
    return (
      '<path d="M12 ' +
      y1 +
      'V' +
      y2 +
      'M8.5 ' +
      y2 +
      'h7" stroke="' +
      OUTLINE +
      '" stroke-width="1.6" fill="none"/>'
    );
  }
  // the glasses: flute 🥂, wine 🍷, ballon, old fashioned 🥃 & highball
  var GLASSES = {
    flute: svg(
      '<path d="M9.5 2h5l-.6 9.5a1.9 1.9 0 0 1-3.8 0z" fill="#f6e7b0" stroke="' +
        OUTLINE +
        '" stroke-width="1.3"/><path d="M9.9 6h4.2l-.4 5.4a1.7 1.7 0 0 1-3.4 0z" fill="#f2c94c"/><circle cx="11.6" cy="8.5" r=".5" fill="#fff"/><circle cx="12.6" cy="7" r=".4" fill="#fff"/>' +
        stem(13.5, 21.5),
    ),
    wine: svg(
      '<path d="M6.5 2.5h11c.3 5.5-2 9-5.5 9s-5.8-3.5-5.5-9z" fill="#f4e9ec" stroke="' +
        OUTLINE +
        '" stroke-width="1.3"/><path d="M7 6.5h10c-.4 3.2-2.2 4.8-5 4.8S7.4 9.7 7 6.5z" fill="#a8233f"/>' +
        stem(11.5, 21.5),
    ),
    ballon: svg(
      '<path d="M5 3h14c.6 7-2.6 10-7 10S4.4 10 5 3z" fill="#e3f3fa" stroke="' +
        OUTLINE +
        '" stroke-width="1.3"/><path d="M5.6 7h12.8c-.4 3.6-2.9 5.3-6.4 5.3S6 10.6 5.6 7z" fill="#bfe6f5"/><circle cx="14.5" cy="8.6" r="2" fill="#8bc34a" stroke="#cfe8a0" stroke-width=".6"/><rect x="8" y="7.6" width="2.6" height="2.6" rx=".5" fill="#fff" opacity=".9"/>' +
        stem(13, 21.5),
    ),
    old: svg(
      '<path d="M4.5 8h15l-1.2 12.5a1.6 1.6 0 0 1-1.6 1.5H7.3a1.6 1.6 0 0 1-1.6-1.5z" fill="#f3ebe0" stroke="' +
        OUTLINE +
        '" stroke-width="1.3"/><path d="M5.2 13h13.6l-.7 7.4a1.2 1.2 0 0 1-1.2 1H7.1a1.2 1.2 0 0 1-1.2-1z" fill="#d9822b"/><rect x="8" y="11" width="4.2" height="4.2" rx=".8" fill="#fff" opacity=".85" transform="rotate(-10 10 13)"/>',
    ),
    high: svg(
      '<path d="M7 2h10l-.8 19a1.2 1.2 0 0 1-1.2 1H9a1.2 1.2 0 0 1-1.2-1z" fill="#eef6fb" stroke="' +
        OUTLINE +
        '" stroke-width="1.3"/><path d="M7.3 8h9.4l-.55 12.9a1 1 0 0 1-1 .9H8.85a1 1 0 0 1-1-.9z" fill="#9fd3ec"/><circle cx="10.5" cy="12" r=".7" fill="#fff"/><circle cx="13" cy="15.5" r=".6" fill="#fff"/><circle cx="11.2" cy="18" r=".5" fill="#fff"/><path d="M14 0.8 11.5 10" stroke="#e53935" stroke-width="1.4"/>',
    ),
  };

  /**
   * `bottle` - Function 🍾
   *
   * @param { string } color - the bottle color
   * @param { string } [cap] - the cap color
   * @param { string } [lab] - the label color
   * @returns { string } - a bottle icon
   */
  function bottle(color, cap, lab) {
    return svg(
      '<path d="M10 2h4v4.2l2 2.6V21a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V8.8l2-2.6z" fill="' +
        color +
        '" stroke="rgba(0,0,0,.25)" stroke-width=".8"/><rect x="9.8" y="1.4" width="4.4" height="2" rx=".5" fill="' +
        (cap || '#c9a227') +
        '"/><rect x="8.9" y="12" width="6.2" height="5" rx=".8" fill="' +
        (lab || '#fff') +
        '" opacity=".9"/>',
    );
  }

  /**
   * `slice` - Function 🍋
   *
   * @param { string } rim - the peel color
   * @param { string } flesh - the flesh color
   * @returns { string } - a citrus slice icon
   */
  function slice(rim, flesh) {
    return svg(
      '<circle cx="12" cy="12" r="9.5" fill="' +
        rim +
        '"/><circle cx="12" cy="12" r="7.8" fill="#fffbe6"/><circle cx="12" cy="12" r="7" fill="' +
        flesh +
        '"/><path d="M12 5v14M5 12h14M7 7l10 10M17 7 7 17" stroke="#fffbe6" stroke-width="1"/><circle cx="12" cy="12" r="1.2" fill="#fffbe6"/>',
    );
  }

  /**
   * `juice` - Function 🧃
   *
   * @param { string } color - the juice color
   * @returns { string } - a glass of juice with a straw
   */
  function juice(color) {
    return svg(
      '<path d="M6 5h12l-1.4 15.5a1.6 1.6 0 0 1-1.6 1.5H9a1.6 1.6 0 0 1-1.6-1.5z" fill="#f3f6f8" stroke="' +
        OUTLINE +
        '" stroke-width="1.3"/><path d="M6.6 9.5h10.8l-1.1 11a1.2 1.2 0 0 1-1.2 1.1H8.9a1.2 1.2 0 0 1-1.2-1.1z" fill="' +
        color +
        '"/><path d="M15 2 13 12" stroke="#43a047" stroke-width="1.4"/>',
    );
  }

  /**
   * `emo` - Function 😀
   *
   * @param { string } emoji - an emoji
   * @returns { string } - the emoji as an icon
   */
  function emo(emoji) {
    return '<span class="bie">' + emoji + '</span>';
  }
  // the straw, "none", cranberries & the citrus slices
  var STRAW = svg(
      '<path d="M15.5 1.5 9 22.5" stroke="#e53935" stroke-width="3.2"/><path d="M15.5 1.5 9 22.5" stroke="#fff" stroke-width="3.2" stroke-dasharray="2 2.6"/>',
    ),
    NONE = svg(
      '<circle cx="12" cy="12" r="8.5" fill="none" stroke="#8a97a8" stroke-width="2"/><path d="M6 18 18 6" stroke="#8a97a8" stroke-width="2"/>',
    ),
    CRAN = svg(
      '<circle cx="9" cy="14" r="5" fill="#c62828"/><circle cx="15.5" cy="10" r="4.5" fill="#e53935"/><circle cx="14.5" cy="17" r="3.8" fill="#b71c1c"/><circle cx="7.5" cy="12.5" r="1" fill="#fff" opacity=".6"/><circle cx="14.2" cy="8.8" r=".9" fill="#fff" opacity=".6"/>',
    ),
    LEMON = slice('#f5c518', '#ffe45c'),
    LIME = slice('#5a9e2f', '#a5d65a'),
    ORANGE = slice('#f08a1c', '#ffb547');
  // the rules: first pattern that matches the (lowercase) chip value wins 🏷️
  var RULES = [
    [/fl[uû]te/, GLASSES.flute],
    [/ballon|balloon/, GLASSES.ballon],
    [/vin|wine/, GLASSES.wine],
    [/old fashioned/, GLASSES.old],
    [/highball/, GLASSES.high],
    [/jus d.orange|orange juice/, juice('#ffa726')],
    [/cranberry juice|jus de cranberry/, juice('#c2185b')],
    [/ananas|pineapple/, emo('🍍')],
    [/fleur d.oranger|orange blossom/, emo('🌼')],
    [/citron vert|lime/, LIME],
    [/citron|lemon/, LEMON],
    [/orange/, ORANGE],
    [/cranberry/, CRAN],
    [/paille|straw/, STRAW],
    [/p[eê]che|peach/, emo('🍑')],
    [/lavande|lavender/, bottle('#9575cd', '#5e35b1')],
    [/champagne/, bottle('#1b5e20', '#f2c94c', '#f6e7b0')],
    [/prosecco/, bottle('#7cb342', '#e0c068')],
    [/bitter/, bottle('#d84315', '#212121')],
    [/perrier/, bottle('#2e7d32', '#e0e0e0', '#f9e04b')],
    [/gin/, bottle('#b3e5fc', '#1565c0')],
    [/thym|thyme/, bottle('#558b2f', '#33691e')],
    [/tonic/, bottle('#fff59d', '#9e9e9e')],
    [/rhum|rum/, bottle('#a0522d', '#3e2723')],
    [/framboise|raspberry/, bottle('#ad1457', '#880e4f')],
    [/angostura/, bottle('#5d4037', '#f9a825', '#fff8e1')],
    [/sirop|syrup/, bottle('#fff3e0', '#8d6e63')],
    [/notre-dame|tea\b|th[ée] /, emo('🍵')],
    [/earl grey/, emo('🫖')],
    [/menthe|mint/, emo('🌿')],
    [/^eau$|^water$/, emo('💧')],
    [/^—$/, NONE],
  ];

  /**
   * `one` - Function 🔎
   *
   * @param { string } value - a chip value
   * @returns { string } - its icon ('' when none matches)
   */
  function one(value) {
    value = value.toLowerCase().trim();
    for (var index = 0; index < RULES.length; index++)
      if (RULES[index][0].test(value)) return RULES[index][1];
    return '';
  }

  /**
   * `icons` - Function 🎨
   *
   * @param { string } value - a chip value
   * @param { boolean } [multi] - garnish: one icon per part ("lemon + mint")
   * @returns { string } - the icon(s)
   */
  function icons(value, multi) {
    if (!multi) return one(value);
    var single = one(value);
    if (/[,+]/.test(value)) {
      single = '';
      value.split(/[,+]/).forEach(function (part) {
        single += one(part);
      });
    }
    return single;
  }
  // a repaint is already queued?
  var queued = 0;

  /**
   * `run` - Function ✨
   *
   * Adds the icon to every chip of the bar game that doesn't have one yet.
   *
   * @returns { void }
   */
  function run() {
    queued = 0;
    ['sh', 'gl', 'ga'].forEach(function (id) {
      var box = document.getElementById(id);
      if (!box) return;
      box.querySelectorAll('.chip[data-v]:not([data-bi])').forEach(function (chip) {
        chip.setAttribute('data-bi', '1');
        var iconHtml = icons(chip.getAttribute('data-v'), id === 'ga');
        if (iconHtml) chip.insertAdjacentHTML('afterbegin', '<span class="bi">' + iconHtml + '</span>');
      });
    });
  }
  // 👂 at most one pass per frame
  new MutationObserver(function () {
    if (!queued) {
      queued = 1;
      requestAnimationFrame(run);
    }
  }).observe(document.body, { childList: true, subtree: true });
  run();
  // 🧪 exposed for the tests
  window.__barIcons = icons;
})();
</script>

<script>
// 📲 "Installer l'app": keep the browser's install prompt and show our own button instead
let deferredPrompt;
addEventListener('beforeinstallprompt', event => {
  event.preventDefault();
  deferredPrompt = event;
  // show the #inst button
  const installButton = document.getElementById('inst');
  installButton.style.display = 'block';
  // 👆 tap: hide the button & open the install prompt
  installButton.onclick = async () => {
    installButton.style.display = 'none';
    deferredPrompt.prompt();
    deferredPrompt = null;
  };
});
</script>
